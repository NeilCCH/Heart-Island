<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- 萌寵心靈島 App 圖示：霧藍到暖杏的漸層底、中央一團暖光，小貓與小狗並排坐著；沒有任何外框。以瀏覽器開啟後截圖 1024×1024，再縮成 public/icons 各尺寸。 -->
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7cae6"/><stop offset="0.55" stop-color="#d4d4ea"/><stop offset="1" stop-color="#f1d2c2"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#fffaf2" stop-opacity="0.85"/><stop offset="1" stop-color="#fffaf2" stop-opacity="0"/></radialGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#2a3d66" stop-opacity="0.22"/><stop offset="1" stop-color="#2a3d66" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <circle cx="512" cy="470" r="460" fill="url(#glow)"/>
 <ellipse cx="330" cy="842" rx="180" ry="30" fill="url(#shadow)"/>
 <ellipse cx="700" cy="830" rx="190" ry="30" fill="url(#shadow)"/>
 <image href="../../public/assets/cat/cutout.webp" x="120" y="320" width="430" height="519"/>
 <image href="../../public/assets/dog/cutout.webp" x="482" y="310" width="440" height="515"/>
</svg>