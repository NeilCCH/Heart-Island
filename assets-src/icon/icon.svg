<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- 心靈小島 App 圖示：小貓與小狗像好朋友一樣坐在一朵柔邊的白雲上，背景有星星與暖光。以瀏覽器開啟後截圖 1024×1024，再縮成 public/icons 各尺寸。 -->
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9bfe0"/><stop offset="0.55" stop-color="#c3cbe6"/><stop offset="1" stop-color="#eccbb9"/></linearGradient>
  <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
   <path d="M180 820 C 100 820 70 740 110 690 C 70 630 100 540 180 530 C 170 430 260 360 350 390 C 390 300 500 270 570 320 C 640 270 760 300 780 400 C 880 390 950 470 920 560 C 990 600 990 720 910 760 C 900 820 840 840 790 820 Z" fill="#fff" filter="url(#feather)" transform="translate(0 -20)"/>
   <rect x="0" y="0" width="1024" height="560" fill="#fff"/>
  </mask>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <g fill="#ffffff" opacity="0.8"><circle cx="190" cy="200" r="7"/><circle cx="820" cy="180" r="6"/><circle cx="880" cy="300" r="4"/><circle cx="150" cy="330" r="4"/><circle cx="700" cy="110" r="4"/></g>
 <circle cx="512" cy="420" r="330" fill="#fff7ec" opacity="0.55" filter="url(#feather)"/>
 <path d="M180 820 C 100 820 70 740 110 690 C 70 630 100 540 180 530 C 170 430 260 360 350 390 C 390 300 500 270 570 320 C 640 270 760 300 780 400 C 880 390 950 470 920 560 C 990 600 990 720 910 760 C 900 820 840 840 790 820 Z" fill="#ffffff" opacity="0.95" filter="url(#feather)" transform="translate(0 -20)"/>
 <g mask="url(#m)">
  <image href="../../public/assets/cat/cutout.webp" x="130" y="300" width="440" height="531"/>
  <image href="../../public/assets/dog/cutout.webp" x="470" y="290" width="450" height="527"/>
 </g>
</svg>