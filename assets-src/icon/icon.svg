<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a7d"/>
      <stop offset="0.45" stop-color="#8fa9d1"/>
      <stop offset="0.72" stop-color="#f3d3bd"/>
      <stop offset="1" stop-color="#f7e3d3"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="0.55" stop-color="#ffe9c9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe0b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9fc8"/>
      <stop offset="1" stop-color="#3d5c8f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6cf"/>
      <stop offset="1" stop-color="#e2c9a6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3b0"/>
      <stop offset="1" stop-color="#8fb48a"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6a9a2"/>
      <stop offset="1" stop-color="#e07f86"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- 星星 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="214" cy="190" r="7"/><circle cx="330" cy="120" r="4.5"/><circle cx="790" cy="170" r="5"/>
    <circle cx="860" cy="280" r="3.5"/><circle cx="150" cy="320" r="3.5"/>
  </g>
  <g transform="translate(512 560) scale(1.2) translate(-512 -560)">
  <!-- 暖光與太陽 -->
  <circle cx="512" cy="560" r="300" fill="url(#sun)"/>
  <circle cx="512" cy="560" r="118" fill="#fff6e6"/>
  </g>
  <!-- 海 -->
  <rect y="600" width="1024" height="424" fill="url(#sea)"/>
  <rect y="600" width="1024" height="10" fill="#ffffff" opacity="0.25"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M120 790 q60 -22 120 0 t120 0" stroke-width="12" opacity="0.45"/>
    <path d="M664 820 q60 -22 120 0 t120 0" stroke-width="12" opacity="0.45"/>
    <path d="M300 900 q60 -22 120 0 t120 0 t120 0" stroke-width="12" opacity="0.3"/>
  </g>
  <g transform="translate(512 600) scale(1.22) translate(-512 -600)">
  <!-- 小島 -->
  <ellipse cx="512" cy="700" rx="290" ry="46" fill="#24406f" opacity="0.28"/>
  <path d="M232 690 Q330 590 512 586 Q694 590 792 690 Z" fill="url(#sand)"/>
  <path d="M292 664 Q370 600 512 598 Q654 600 732 664 Q512 640 292 664 Z" fill="url(#grass)"/>
  <!-- 愛心樹：樹幹＋心形樹冠 -->
  <path d="M512 610 C512 560 506 520 500 470" fill="none" stroke="#9b7656" stroke-width="26" stroke-linecap="round"/>
  <path d="M500 486 C 380 410 370 300 440 280 C 474 270 494 292 500 316 C 506 292 526 270 560 280 C 630 300 620 410 500 486 Z" fill="url(#heart)"/>
  <path d="M452 312 C 438 330 436 352 446 372" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
