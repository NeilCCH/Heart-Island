<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- 心靈小島 App 圖示：小貓與小狗並肩坐在圓形光台上，上方一顆小愛心。以瀏覽器開啟後截圖 1024×1024，再縮成 public/icons 各尺寸。 -->
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6d5ec"/><stop offset="0.55" stop-color="#e3e3ee"/><stop offset="1" stop-color="#f6dccb"/></linearGradient>
  <radialGradient id="disc" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.8" stop-color="#fbf7f2"/><stop offset="1" stop-color="#f1ebe4"/></radialGradient>
  <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7aeb0"/><stop offset="1" stop-color="#e57f8c"/></linearGradient>
  <clipPath id="c"><circle cx="512" cy="530" r="400"/></clipPath>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2a3d66" flood-opacity="0.18"/></filter>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <circle cx="512" cy="530" r="400" fill="url(#disc)" filter="url(#soft)"/>
 <g clip-path="url(#c)">
  <ellipse cx="512" cy="905" rx="330" ry="40" fill="#2a3d66" opacity="0.08"/>
  <image href="../../public/assets/cat/cutout.webp" x="88" y="318" width="502" height="606"/>
  <image href="../../public/assets/dog/cutout.webp" x="432" y="300" width="530" height="620"/>
 </g>
 <!-- 兩隻萌寵中間上方的小愛心 -->
 <g transform="translate(512 238) rotate(-6)">
  <path d="M0 52 C -78 2 -84 -58 -44 -70 C -22 -76 -6 -62 0 -46 C 6 -62 22 -76 44 -70 C 84 -58 78 2 0 52 Z" fill="url(#heart)"/>
  <path d="M-36 -48 C -50 -38 -54 -22 -48 -8" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
 </g>
</svg>