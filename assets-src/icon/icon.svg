<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- 心靈小島 App 圖示：柔邊的大愛心框住並肩坐著的小貓與小狗。以瀏覽器開啟後截圖 1024×1024，再縮成 public/icons 各尺寸。 -->
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9bfe0"/><stop offset="0.55" stop-color="#c9c8e2"/><stop offset="1" stop-color="#eec5b6"/></linearGradient>
  <radialGradient id="fill" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#fff8f3"/><stop offset="1" stop-color="#ffe9e4"/></radialGradient>
  <!-- 愛心邊緣虛化：同一個愛心形狀做高斯模糊，邊緣自然淡出，沒有框線 -->
  <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
   <path d="M512 930 C 250 770 92 600 92 420 C 92 262 210 160 340 160 C 422 160 482 204 512 262 C 542 204 602 160 684 160 C 814 160 932 262 932 420 C 932 600 774 770 512 930 Z" fill="#fff" filter="url(#feather)" transform="translate(512 545) scale(0.94) translate(-512 -545)"/>
  </mask>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
 <!-- 愛心外圍的淡淡粉色光暈 -->
 <path d="M512 930 C 250 770 92 600 92 420 C 92 262 210 160 340 160 C 422 160 482 204 512 262 C 542 204 602 160 684 160 C 814 160 932 262 932 420 C 932 600 774 770 512 930 Z" fill="#f6a7b0" opacity="0.75" filter="url(#feather)" transform="translate(512 545) scale(1.06) translate(-512 -545)"/>
 <path d="M512 930 C 250 770 92 600 92 420 C 92 262 210 160 340 160 C 422 160 482 204 512 262 C 542 204 602 160 684 160 C 814 160 932 262 932 420 C 932 600 774 770 512 930 Z" fill="url(#fill)" filter="url(#feather)"/>
 <g mask="url(#m)">
  <image href="../../public/assets/cat/cutout.webp" x="118" y="330" width="470" height="567"/>
  <image href="../../public/assets/dog/cutout.webp" x="436" y="312" width="500" height="585"/>
 </g>
</svg>